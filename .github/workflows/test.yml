name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unixodbc-dev

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout=5m

      - name: Run tests
        run: go test -race -cover ./...

  sonarcloud:
    # Coverage reporting needs the SonarCloud token, which pull requests from
    # forks do not receive; the lint and test job above is the gate for those.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Get repository name
        run: echo "REPOSITORY_NAME=${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          # Full history improves SonarQube analysis.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unixodbc-dev

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout=5m --issues-exit-code=0

      - name: Collect reports
        run: |
          golangci-lint run --output.checkstyle.path=golangci-lint-report.out --issues-exit-code=0 ./...
          go test -coverprofile=coverage.out -json ./... > test-report.out

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          args: >
            -Dsonar.organization=${{ github.repository_owner }}
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ env.REPOSITORY_NAME }}
            -Dsonar.go.coverage.reportPaths=coverage.out
            -Dsonar.go.tests.reportPaths=test-report.out
            -Dsonar.go.golangci-lint.reportPaths=golangci-lint-report.out
            -Dsonar.sources=.
            -Dsonar.exclusions=**/vendor/**,**/*_test.go,_example/**
            -Dsonar.tests=.
            -Dsonar.test.inclusions=**/*_test.go
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
