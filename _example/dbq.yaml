# Example dbq configuration.
#
# dbq looks for dbq.yaml / dbq.toml / dbq.json in the working directory, or the
# file named by CONFIG_FILE (also settable with --config).
#
# Every value can be overridden from the environment with the DBQ_ prefix and
# underscores for nesting:
#
#   DBQ_SERVER_PORT=9090
#   DBQ_MCP_ENDPOINTS_SAFE_WRITE_ENABLED=true
#   DBQ_CONNECTIONS_PROD_SOURCE='postgres://...'
#
# Keep DSNs out of this file in anything but local development; the source field
# is masked in logs but the file itself is not a secret store.

log_level: info

connections:
  local:
    type: pgx
    source: "postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable"
    description: "local development database"
    # read-only | safe-write | full
    permission: full

  prod:
    type: pgx
    source: "postgres://readonly@prod.internal:5432/app"
    description: "production reporting replica, reads only"
    permission: read-only

  legacy:
    # Keep a connection profile for later without exposing or checking it.
    disabled: true
    type: sqlserver
    source: "sqlserver://user:pass@mssql.internal:1433?database=legacy"
    description: "legacy billing system"
    permission: read-only

  bas:
    type: odbc
    dialect: ingres
    source: "DSN=bas"
    description: "Ingres BAS database"
    permission: read-only

  scratch:
    type: sqlite3
    source: "./scratch.db"
    permission: full

server:
  host: ""
  port: "8080"
  shutdown_timeout: 10s
  # Enabled connections must pass a ping before the server starts.
  connection_check_timeout: 10s

mcp:
  # Set to false to serve only the health and liveness probes.
  enabled: true

  # Each path has its own permission ceiling and optional connection allowlist.
  # Connection permissions remain an upper bound, so prod stays read-only even
  # on the full endpoint.
  endpoints:
    - path: /mcp
      permission: full
      allow: [local, prod, bas, scratch]
    - path: /mcp/reporting
      permission: read-only
      allow: [prod, bas]

  # Cap on rows returned by one tool call. Responses set truncated=true when hit.
  max_rows: 200

  # Cap on characters kept per text value. A row cap alone does not bound a
  # response: one TEXT or JSON column can hold megabytes. Responses set
  # cells_truncated when values were shortened.
  max_cell_chars: 500

  # Cap on tables described by dbq_schema_context in one call.
  max_schema_tables: 40

  # Wall-clock limit for one statement, so an agent-issued cartesian join
  # cannot pin a connection until the client gives up.
  query_timeout: 30s

  # Stateless is the default and describes what dbq is: nothing is carried
  # between tool calls. Keeping sessions on only adds a failure mode — a request
  # that lands on another replica, or arrives after a restart, is rejected with
  # "session not found". Turn it off only for a client that requires the
  # session handshake.
  stateless: true

  # Return application/json instead of text/event-stream.
  json_response: false

  # Close idle MCP sessions. Zero means never. Ignored while stateless is true,
  # because there are no sessions to expire.
  session_timeout: 30m
